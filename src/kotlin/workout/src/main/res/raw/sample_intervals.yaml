version: 1
name: 3-minute intervals
description: Five fast efforts with jogs in between
steps:
  - name: Warm-up
    duration: 10m
    pace: 6:30/km
    incline: 1
  - repeat: 5
    steps:
      - name: Fast
        duration: 3m
        pace: 4:30/km
        incline: 2
        note: Keep your cadence up
      - name: Jog
        distance: 400m
        pace: 7:00/km
  - name: Walk
    duration: 2m
    speed: 5 km/h
  - name: Cool-down
    duration: 10m
    pace: 6:30/km
    incline: 0
