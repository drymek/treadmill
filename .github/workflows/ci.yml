name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Test the Go version installed below, never a toolchain go.mod asks for.
  GOTOOLCHAIN: local
  # Every push to main that passes all checks is released as panel-v<RELEASE_VERSION>.
  # Raise the 0.1 prefix by hand for bigger changes.
  RELEASE_VERSION: 0.1.${{ github.run_number }}

jobs:
  check:
    name: Check (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [oldstable, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: src/go/*/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task go:check

  kotlin:
    name: Kotlin and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # ANDROID_HOME points at the SDK preinstalled on GitHub's Ubuntu runners.
      - run: task kotlin:check

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: src/go/*/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task go:vuln

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: src/go/*/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task go:fuzz FUZZTIME=30s

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: src/go/*/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task go:cover
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: src/go/lib/coverage.html

  # ── Release: only for pushes to main, after every check above passed ──────

  package-go:
    name: Package panel (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, kotlin, vuln, fuzz, coverage]
    strategy:
      matrix:
        include:
          # The macOS Bluetooth stack needs cgo, so darwin builds run on a Mac.
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: src/go/*/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task go:package GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=$RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  package-android:
    name: Package Android apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, kotlin, vuln, fuzz, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the signing key
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: task kotlin:release VERSION=$RELEASE_VERSION VERSION_CODE=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # An unsigned build is named <app>-release-unsigned.apk and cannot be installed.
      - name: Check the APKs are signed
        run: |
          test -f src/kotlin/panel/build/outputs/apk/release/panel-release.apk
          test -f src/kotlin/workout/build/outputs/apk/release/workout-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: panel-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Release
    needs: [package-go, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the package jobs, not the coverage report.
          pattern: panel-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="panel-v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run of the same workflow run replaces the files.
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Panel $RELEASE_VERSION" --generate-notes
          fi
