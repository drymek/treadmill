name: New device or observation
description: Share a log from another treadmill model, or something that contradicts the specification.
labels: [protocol]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! CONTRIBUTING.md ("Recording a protocol log") explains how to record a log with the probe tool.
        Attach the safety key before sending any command.
  - type: input
    id: device
    attributes:
      label: Treadmill
      description: Brand, model, and the name it advertises over Bluetooth.
      placeholder: e.g. <brand> <model>, advertises as RZ_TreadMil
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: What you sent, what the treadmill did, what the display showed, and which part of docs/protocol.md it confirms or contradicts.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the relevant probe log lines, or drag the log file here.
      render: text
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: Photos of the display
      description: Optional. Photo file names (HHMMSS.jpg) match the log times.
